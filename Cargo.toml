[package]
name = "ssbot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chromiumoxide = "0.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
fast_image_resize = "6"
futures = "0.3.34"
image = "0.25"
image_hasher = "3.1.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xcap = { version = "0.9", optional = true }

[features]
xcap = ["dep:xcap"]
