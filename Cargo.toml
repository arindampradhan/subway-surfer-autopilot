[workspace]
members = ["crates/*"]
# Claude Code worktrees live under .claude/worktrees/; one checked out at an older commit is its
# own (pre-workspace) package and must not be pulled into this workspace.
exclude = [".claude"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ssbot-engine = { path = "crates/engine" }
ssbot-runtime = { path = "crates/runtime" }
ssbot-lab = { path = "crates/lab" }

anyhow = "1.0.104"
base64 = "0.23.1"
chromiumoxide = "0.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
fast_image_resize = "6"
futures = "0.3.34"
image = "0.25"
image_hasher = "3.1.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Features per crate: ssbot-engine only needs `sync` (the sidecar channels), the rest use `full`.
tokio = "1"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xcap = "0.9"
